apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: northgate-chase
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "1"
    spec:
      serviceAccountName: "__RUNTIME_SERVICE_ACCOUNT__"
      containerConcurrency: 1
      timeoutSeconds: 300
      containers:
        - image: "__IMAGE__"
          ports:
            - name: http1
              containerPort: 8080
          env:
            - name: NG_OVERDUE_DAYS
              value: "7"
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /api/health
            timeoutSeconds: 5
            periodSeconds: 10
            failureThreshold: 12
