name: Container CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python test dependencies
        run: python -m pip install -r ai_service/requirements-dev.txt

      - name: Run Node tests
        run: npm test

      - name: Run AI service tests
        run: npm run test:ai

      - name: Build frontend
        run: npm run build

      - name: Lint frontend
        run: npm run lint

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.GCP_PROJECT_ID != '' && vars.GCP_REGION != '' && vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && vars.GCP_DEPLOYER_SERVICE_ACCOUNT != '' && vars.GCP_RUNTIME_SERVICE_ACCOUNT != ''
    needs: test-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: northgate-cloud-run
      cancel-in-progress: false
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      DEPLOYER_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
      RUNTIME_SERVICE_ACCOUNT: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Configure Artifact Registry authentication
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/northgate/northgate-chase:${{ github.sha }}

      - name: Render Cloud Run service configuration
        env:
          IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/northgate/northgate-chase:${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          template = Path("deploy/cloud-run.yaml").read_text()
          rendered = template.replace("__IMAGE__", os.environ["IMAGE"])
          rendered = rendered.replace(
              "__RUNTIME_SERVICE_ACCOUNT__",
              os.environ["RUNTIME_SERVICE_ACCOUNT"],
          )
          if "__IMAGE__" in rendered or "__RUNTIME_SERVICE_ACCOUNT__" in rendered:
              raise SystemExit("Cloud Run configuration contains an unresolved placeholder.")
          Path(os.environ["RUNNER_TEMP"], "cloud-run.yaml").write_text(rendered)
          PY

      - name: Deploy public synthetic-data preview
        run: |
          gcloud run services replace "${RUNNER_TEMP}/cloud-run.yaml" \
            --project="$PROJECT_ID" \
            --region="$REGION"
          gcloud run services add-iam-policy-binding northgate-chase \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --member="allUsers" \
            --role="roles/run.invoker" \
            --quiet

      - name: Report deployment URL
        run: |
          SERVICE_URL="$(gcloud run services describe northgate-chase \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --format='value(status.url)')"
          echo "Deployed public synthetic-data preview: ${SERVICE_URL}" >> "$GITHUB_STEP_SUMMARY"
